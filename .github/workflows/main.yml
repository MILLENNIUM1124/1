name: Build Leica LUX Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android Project Structure
        run: |
          # 如果上传时套了一层子文件夹，自动移到根目录
          if [ -f "LeicaColorCamera_AndroidProject/settings.gradle.kts" ]; then
            cp -r LeicaColorCamera_AndroidProject/* .
          fi
          # 如果仓库里只有 HTML 文件，自动补齐原生 Android 包装工程
          if [ ! -f "settings.gradle.kts" ]; then
            mkdir -p app/src/main/java/com/leicalux/camera app/src/main/assets
            HTML_FILE=$(find . -maxdepth 3 -name "*.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" app/src/main/assets/leica_camera_studio.html
            fi
            cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LeicaLuxCamera"
          include(":app")
          EOF
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.leicalux.camera"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.leicalux.camera"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.4.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          EOF
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" />
              <uses-permission android:name="android.permission.CAMERA" />
              <application
                  android:allowBackup="true"
                  android:label="Leica LUX 色卡相机"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
            cat << 'EOF' > app/src/main/java/com/leicalux/camera/MainActivity.kt
          package com.leicalux.camera
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          class MainActivity : Activity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.allowFileAccess = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.cacheMode = WebSettings.LOAD_DEFAULT
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.grant(request.resources)
                          }
                      }
                      loadUrl("file:///android_asset/leica_camera_studio.html")
                  }
                  setContentView(webView)
              }
          }
          EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeicaLuxCamera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
